[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxcaps"
version = "0.1.0"
description = "Scope-structured audio annotation and refinement tools"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
quality = ["torch>=2.1", "torchaudio>=2.1"]
models = ["torch>=2.1", "torchaudio>=2.1", "numpy", "librosa", "soundfile", "audiofile", "audioread", "ml-collections", "PyYAML", "scipy", "six", "funasr>=1.4", "qwen-asr", "modelscope>=1.38", "huggingface-hub", "onnxruntime", "pypinyin", "scikit-learn", "umap-learn", "hdbscan"]

[project.scripts]
voxcaps = "voxcaps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"voxcaps.speech_preprocessing.uvr" = ["src/models_dir/**/*.json", "src/models_dir/**/*.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "src/voxcaps/speech_preprocessing/uvr",
  "src/voxcaps/speech_preprocessing/speakerlab",
  "src/voxcaps/speech_preprocessing/diarization.py",
  "src/voxcaps/data_refinement/dnsmos.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
